sonar.projectKey=Harshit-Mehta-Dev_OUTPOST-APP
sonar.organization=harshit-mehta-dev

# Source directories
sonar.sources=src,server

# Exclusions - test files, generated files, legacy files, and animation-only files
sonar.exclusions=\
  **/dist/**,\
  **/node_modules/**,\
  **/coverage/**,\
  **/*.cjs,\
  **/playground-1.mongodb.js,\
  **/test_*.js,\
  **/test_*.mjs,\
  **/swagger.js,\
  **/swagger_output.json,\
  **/query_mongo.cjs,\
  **/query_all_mongo.cjs,\
  **/src/components/BeamsBackground.jsx,\
  **/src/components/ui/gradient-bars-background.jsx

# Test file patterns
sonar.test.exclusions=**/node_modules/**,**/dist/**

# Code duplication exclusions - animation/visual-only components
sonar.cpd.exclusions=\
  **/server/**,\
  **/src/components/BeamsBackground.jsx,\
  **/src/components/HelpDesk.jsx,\
  **/src/components/FeedbackForm.jsx,\
  **/src/pages/Auth.jsx

# JavaScript/JSX file encoding
sonar.sourceEncoding=UTF-8
