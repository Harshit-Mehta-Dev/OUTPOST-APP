[outpost_edge]
outpost-edge-01 ansible_host=edge1.outpost.internal ansible_user=deploy

[outpost_api]
outpost-api-01 ansible_host=api1.outpost.internal ansible_user=deploy
outpost-api-02 ansible_host=api2.outpost.internal ansible_user=deploy

[outpost_monitoring]
outpost-mon-01 ansible_host=mon1.outpost.internal ansible_user=deploy

[outpost_cluster:children]
outpost_edge
outpost_api
outpost_monitoring

[outpost_cluster:vars]
ansible_python_interpreter=/usr/bin/python3
outpost_app_dir=/opt/outpost-app
outpost_env=production
dismw_status=ARMED_AEGIS
dismw_subnet_mode=strict
nagios_server_ip=10.0.10.50
node_version=20.x
