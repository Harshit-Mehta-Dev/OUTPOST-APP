# ==============================================================================
# OUTPOST MONITORING HOST DEFINITIONS
# Render and Supabase block ICMP ping. Use check_tcp (port 443) instead of
# check-host-alive (ICMP) so hosts register as UP correctly.
# ==============================================================================

define host {
    use                     generic-host
    host_name               outpost-edge-proxy
    alias                   Outpost Cloudflare Gateway (Edge CDN)
    address                 1.1.1.1
    check_command           check-host-alive
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    contacts                nagiosadmin
}

define host {
    use                     generic-host
    host_name               outpost-api-primary
    alias                   Outpost Production Node.js API (Render Cloud)
    address                 outpost-app.onrender.com
    ; Render blocks ICMP ping — use TCP port 443 to verify host is UP
    check_command           check_tcp!443
    max_check_attempts      3
    check_period            24x7
    notification_interval   15
    notification_period     24x7
    contacts                nagiosadmin
}

define host {
    use                     generic-host
    host_name               outpost-supabase-db
    alias                   Outpost Supabase PostgreSQL Persistence Layer (Singapore)
    address                 idivdegwxgwudgxcuaso.supabase.co
    ; Supabase blocks ICMP ping — use TCP port 443 to verify host is UP
    check_command           check_tcp!443
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    contacts                nagiosadmin
}

define hostgroup {
    hostgroup_name          outpost-servers
    alias                   All Outpost Core Infrastructure
    members                 outpost-edge-proxy,outpost-api-primary,outpost-supabase-db
}
