# ==============================================================================
# OUTPOST MONITORING HOST DEFINITIONS
# ==============================================================================

define host {
    use                     generic-host
    host_name               outpost-edge-proxy
    alias                   Outpost Cloudflare/Nginx Edge Gateway
    address                 10.0.10.10
    check_command           check-host-alive
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
}

define host {
    use                     generic-host
    host_name               outpost-api-primary
    alias                   Outpost Production Node.js API (Render/VPS)
    address                 10.0.10.20
    check_command           check-host-alive
    max_check_attempts      3
    check_period            24x7
    notification_interval   15
    notification_period     24x7
}

define host {
    use                     generic-host
    host_name               outpost-supabase-db
    alias                   Outpost Supabase PostgreSQL Persistence Layer
    address                 idivdegwxgwudgxcuaso.supabase.co
    check_command           check-host-alive
    max_check_attempts      3
    check_period            24x7
    notification_interval   60
    notification_period     24x7
}

define hostgroup {
    hostgroup_name          outpost-servers
    alias                   All Outpost Core Infrastructure
    members                 outpost-edge-proxy,outpost-api-primary,outpost-supabase-db
}
