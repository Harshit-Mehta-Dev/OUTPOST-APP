# ==============================================================================
# OUTPOST MONITORING HOST DEFINITIONS
# ==============================================================================

define host {
    use                     generic-host
    host_name               outpost-edge-proxy
    alias                   Outpost Cloudflare Gateway
    address                 1.1.1.1
    check_command           check-host-alive
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    contacts                nagiosadmin
}

define host {
    use                     generic-host
    host_name               outpost-api-primary
    alias                   Outpost Production Node.js API (Render)
    address                 outpost-app.onrender.com
    check_command           check-host-alive
    max_check_attempts      3
    check_period            24x7
    notification_interval   15
    notification_period     24x7
    contacts                nagiosadmin
}

define hostgroup {
    hostgroup_name          outpost-servers
    alias                   All Outpost Core Infrastructure
    members                 outpost-edge-proxy,outpost-api-primary
}
