# ==============================================================================
# OUTPOST MONITORING SERVICE DEFINITIONS & SLA ALERTS
# ==============================================================================

# 1. API Health Check
define service {
    use                     generic-service
    host_name               outpost-api-primary
    service_description     Outpost API Health Check
    check_command           check_outpost_api!/api/health
    check_interval          1
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   10
    notification_period     24x7
    notification_options    w,u,c,r
    contacts                nagiosadmin
}

# 2. D.I.S.M.W Security Frontier Wall Status Check
define service {
    use                     generic-service
    host_name               outpost-api-primary
    service_description     D.I.S.M.W Security Engine Sentinel
    check_command           check_dismw_security
    check_interval          1
    retry_interval          1
    max_check_attempts      2
    check_period            24x7
    notification_interval   5
    notification_period     24x7
    notification_options    w,u,c,r
    contacts                nagiosadmin
}

# 3. Scout-Guardian WAF Telemetry Check
define service {
    use                     generic-service
    host_name               outpost-api-primary
    service_description     Scout-Guardian Telemetry Audit
    check_command           check_scout_guardian_telemetry
    check_interval          2
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   15
    notification_period     24x7
    contacts                nagiosadmin
}
