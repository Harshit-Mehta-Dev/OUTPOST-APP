# ==============================================================================
# OUTPOST MONITORING SERVICE DEFINITIONS & SLA ALERTS
# All cloud services use HTTPS — plugins auto-detect onrender.com and supabase.co
# ==============================================================================

# 1. API Health Check — verifies /api/health returns HTTP 200
define service {
    use                     generic-service
    host_name               outpost-api-primary
    service_description     Outpost API Health Check
    check_command           check_outpost_api!/api/health
    check_interval          2
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   10
    notification_period     24x7
    notification_options    w,u,c,r
    contacts                nagiosadmin
}

# 2. D.I.S.M.W Security Frontier Wall Status — must respond ARMED_AEGIS
define service {
    use                     generic-service
    host_name               outpost-api-primary
    service_description     D.I.S.M.W Security Engine Sentinel
    check_command           check_dismw_security
    check_interval          2
    retry_interval          1
    max_check_attempts      2
    check_period            24x7
    notification_interval   5
    notification_period     24x7
    notification_options    w,u,c,r
    contacts                nagiosadmin
}

# 3. Scout-Guardian WAF Telemetry Audit — validates WAF gate is active
define service {
    use                     generic-service
    host_name               outpost-api-primary
    service_description     Scout-Guardian Telemetry Audit
    check_command           check_scout_guardian_telemetry
    check_interval          3
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   15
    notification_period     24x7
    contacts                nagiosadmin
}

# 4. Supabase PostgreSQL HTTPS API Heartbeat — confirms DB is awake (not paused)
define service {
    use                     generic-service
    host_name               outpost-supabase-db
    service_description     Supabase PostgreSQL HTTPS API Heartbeat
    check_command           check_supabase_health
    check_interval          3
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    w,u,c,r
    contacts                nagiosadmin
}
