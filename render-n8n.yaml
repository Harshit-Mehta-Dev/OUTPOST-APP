services:
  - type: web
    name: outpost-n8n
    env: image
    image:
      url: docker.io/n8nio/n8n:latest
    region: oregon
    plan: free
    healthCheckPath: /healthz
    envVars:
      # Database Configuration (Supabase)
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_PORT
        value: "5432"
      - key: DB_POSTGRESDB_DATABASE
        value: postgres
      - key: DB_POSTGRESDB_HOST
        sync: false
      - key: DB_POSTGRESDB_USER
        sync: false
      - key: DB_POSTGRESDB_PASSWORD
        sync: false

      # n8n Core Settings
      - key: N8N_ENFORCEMENT_USER_MANAGEMENT
        value: "true"
      - key: N8N_PORT
        value: "10000"
      - key: N8N_PROTOCOL
        value: "http"
      - key: N8N_PUSH_BACKEND
        value: "sse"
      - key: EXECUTIONS_PROCESS
        value: "main"
      - key: NODE_OPTIONS
        value: "--max-old-space-size=400"
      - key: WEBHOOK_URL
        sync: false
