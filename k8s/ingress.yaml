apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: outpost-ingress
  annotations:
    kubernetes.io/ingress.class: "nginx"
    # Enable WebSocket support for Socket.io
    nginx.ingress.kubernetes.io/websocket-services: "backend-service"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  rules:
  - host: app.outpost.com # Replace with your actual domain
    http:
      paths:
      # Route /api and /socket.io traffic to the Node.js backend
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 10000
      - path: /socket.io
        pathType: Prefix
        backend:
          service:
            name: backend-service
            port:
              number: 10000
      # Route all other traffic to the React frontend
      - path: /
        pathType: Prefix
        backend:
          service:
            name: frontend-service
            port:
              number: 80
