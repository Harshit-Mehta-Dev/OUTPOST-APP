worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      '';
    }

    upstream frontend {
        server frontend:8080;
    }

    upstream backend {
        server backend:10000;
        keepalive 32;
    }

    server {
        listen 80;

        # 1. Stop Cross-Site Scripting (XSS) execution vectors
        add_header X-Content-Type-Options "nosniff" always;
        
        # 2. Prevent clickjacking framing injections completely
        add_header X-Frame-Options "DENY" always;
        
        # 3. Control browser feature access parameters
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

        # WebSocket support for Socket.io
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API routing
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Connection ""; # Clear connection for keepalive
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend routing
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # Dedicated n8n Secure Server
    server {
        listen 8081;

        # 1. Stop Cross-Site Scripting (XSS) execution vectors
        add_header X-Content-Type-Options "nosniff" always;
        
        # 2. Prevent clickjacking framing injections completely
        add_header X-Frame-Options "DENY" always;
        
        # 3. Control browser feature access parameters
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

        location /webhook/ {
            if ($http_x_outpost_token != "outpost_secure_hash_2026") {
                return 401 "Unauthorized Webhook Access\n";
            }
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }

        location / {
            proxy_pass http://n8n:5678;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            chunked_transfer_encoding off;
            proxy_buffering off;
            proxy_cache off;
        }
    }
}
