worker_processes 1;

events { worker_connections 1024; }

http {
    sendfile on;

    upstream frontend {
        server frontend:8080;
    }

    upstream backend {
        server backend:10000;
    }

    server {
        listen 80;

        # 1. Stop Cross-Site Scripting (XSS) execution vectors
        add_header X-Content-Type-Options "nosniff" always;
        
        # 2. Prevent clickjacking framing injections completely
        add_header X-Frame-Options "DENY" always;
        
        # 3. Control browser feature access parameters
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=(self)" always;

        # WebSocket support for Socket.io
        location /socket.io/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # API routing
        location /api/ {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Frontend routing
        location / {
            proxy_pass http://frontend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
