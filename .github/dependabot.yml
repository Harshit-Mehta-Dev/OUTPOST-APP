# Dependabot Configuration File for Outpost
version: 2
updates:
  # Maintain npm dependencies in the root project
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
    open-pull-requests-limit: 50
    commit-message:
      prefix: "chore(deps):"

  # Maintain npm dependencies in the server directory
  - package-ecosystem: "npm"
    directory: "/server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
    open-pull-requests-limit: 50
    commit-message:
      prefix: "chore(deps-server):"

  # Maintain GitHub Actions dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
    open-pull-requests-limit: 50
    commit-message:
      prefix: "ci(deps):"
