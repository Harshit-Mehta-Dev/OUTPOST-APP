name: Production Full Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Automated Testing (CI)
  run-tests:
    name: Automated Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd server && (npm ci || npm install)

      - name: Run Jest Test Suite
        run: npm run test

  # 2. Deploy Frontend to Cloudflare Pages
  deploy-frontend:
    name: Deploy Frontend (Cloudflare)
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name outpost-app --commit-dirty=true

  # 2. Trigger Backend Deployment on Render
  deploy-backend:
    name: Deploy Backend (Render)
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    steps:
      - name: Trigger Render Deploy Hook
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "RENDER_DEPLOY_HOOK secret is missing!"
            exit 1
          fi
          echo "Triggering deployment on Render..."
          curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          echo "Deployment triggered successfully."

  # 3. Backup Supabase Database
  backup-database:
    name: Backup Database (Supabase)
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Backup Supabase Database Schema
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ] || [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "Supabase secrets are missing!"
            exit 1
          fi
          
          echo "Dumping database schema..."
          # Link the project first, then dump the linked database
          supabase link --project-ref ${{ secrets.SUPABASE_PROJECT_ID }}
          supabase db dump --linked --data-only > supabase_backup_$(date +%Y%m%d_%H%M%S).sql
          
          echo "Backup successful. Uploading as artifact..."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Upload Database Backup Artifact
        uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: supabase_backup_*.sql
          retention-days: 7
