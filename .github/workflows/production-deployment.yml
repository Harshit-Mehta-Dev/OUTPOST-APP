name: Production Full Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Automated Testing (CI)
  run-tests:
    name: Automated Security Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd server && (npm ci || npm install)

      - name: Run Jest Test Suite
        run: npm run test

  # 2. Deploy Frontend to Cloudflare Pages
  deploy-frontend:
    name: Deploy Frontend (Cloudflare)
    runs-on: ubuntu-latest
    needs: [run-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build
        env:
          VITE_AUTH_URL: https://outpost-auth-service.onrender.com
          VITE_CHAT_URL: https://outpost-chat-service.onrender.com
          VITE_CORE_API_URL: https://outpost-app.onrender.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name outpost-app --commit-dirty=true

  # 2. Trigger Backend Deployments on Render
  deploy-backend:
    name: Deploy Microservices (Render)
    runs-on: ubuntu-latest
    needs: [deploy-frontend]
    steps:
      - name: Trigger Auth Service Deploy
        run: |
          if [ ! -z "${{ secrets.RENDER_AUTH_HOOK }}" ]; then
            echo "Deploying Auth Service..."
            curl -s -X POST "${{ secrets.RENDER_AUTH_HOOK }}"
          else
            echo "RENDER_AUTH_HOOK not set. Skipping Auth Service."
          fi
          
      - name: Trigger API Service Deploy
        run: |
          if [ ! -z "${{ secrets.RENDER_API_HOOK }}" ]; then
            echo "Deploying API Service..."
            curl -s -X POST "${{ secrets.RENDER_API_HOOK }}"
          else
            echo "RENDER_API_HOOK not set. Skipping API Service."
          fi

      - name: Trigger Chat Service Deploy
        run: |
          if [ ! -z "${{ secrets.RENDER_CHAT_HOOK }}" ]; then
            echo "Deploying Chat Service..."
            curl -s -X POST "${{ secrets.RENDER_CHAT_HOOK }}"
          else
            echo "RENDER_CHAT_HOOK not set. Skipping Chat Service."
          fi

      - name: Legacy Deploy Hook (Fallback)
        run: |
          if [ ! -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ] && [ -z "${{ secrets.RENDER_API_HOOK }}" ]; then
            echo "Falling back to monolithic deployment..."
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          fi

  # 3. Backup Supabase Database
  backup-database:
    name: Backup Database (Supabase)
    runs-on: ubuntu-latest
    needs: [deploy-backend]
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v3
        with:
          version: latest

      - name: Backup Supabase Database Schema
        continue-on-error: true
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ] || [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "Supabase secrets are missing! Skipping optional database backup."
            exit 0
          fi
          
          echo "Dumping database schema..."
          supabase link --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" --password "${{ secrets.SUPABASE_DB_PASSWORD }}" || {
            echo "⚠️ Warning: Supabase link failed (token or credentials unauthorized). Skipping DB backup step."
            exit 0
          }
          supabase db dump --linked --data-only > supabase_backup_$(date +%Y%m%d_%H%M%S).sql || exit 0
          
          echo "Backup successful. Uploading as artifact..."
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Upload Database Backup Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: database-backup
          path: supabase_backup_*.sql
          retention-days: 7
