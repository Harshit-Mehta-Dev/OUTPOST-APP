name: Production Full Deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # 1. Automated Testing (CI)
  run-tests:
    name: Automated Security Tests
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: |
          npm ci || npm install
          cd server && (npm ci --ignore-scripts || npm install --ignore-scripts)

      - name: Run Jest Test Suite
        run: npm run test
        env:
          NODE_ENV: test
          # Stub secrets so server boots without real DB connections
          MONGODB_URI: ""
          REDIS_URL: ""
          JWT_SECRET: "ci-test-secret-stub"
          SUPABASE_URL: "https://idivdegwxgwudgxcuaso.supabase.co"

  # 2. Infra-as-Code & Config Automation Validation (Puppet + Ansible + Nagios)
  validate-iac-pipeline:
    name: Validate Puppet, Ansible & Nagios Configs
    runs-on: ubuntu-24.04
    needs: [run-tests]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Ansible & Shellcheck
        run: |
          sudo apt-get update
          sudo apt-get install -y ansible shellcheck jq

      - name: Verify Ansible Playbook Syntax
        run: |
          ansible-playbook -i ops/ansible/inventory/hosts.ini ops/ansible/site.yml --syntax-check

      - name: Validate Nagios Plugins Executability
        run: |
          chmod +x ops/nagios/plugins/*.sh ops/pipeline/*.sh
          shellcheck ops/nagios/plugins/*.sh ops/pipeline/*.sh || true

  # 3. Deploy Frontend to Cloudflare Pages
  deploy-frontend:
    name: Deploy Frontend (Cloudflare)
    runs-on: ubuntu-24.04
    needs: [validate-iac-pipeline]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Build Application
        run: npm run build
        env:
          VITE_AUTH_URL: https://outpost-auth-service.onrender.com
          VITE_CHAT_URL: https://outpost-chat-service.onrender.com
          VITE_CORE_API_URL: https://outpost-app.onrender.com

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name outpost-app --commit-dirty=true

  # 4. Trigger Backend Deployments on Render
  deploy-backend:
    name: Deploy Microservices (Render)
    runs-on: ubuntu-24.04
    needs: [deploy-frontend]
    steps:
      - name: Trigger Auth Service Deploy
        run: |
          if [ -n "${{ secrets.RENDER_AUTH_HOOK }}" ]; then
            echo "Deploying Auth Service..."
            curl -s -X POST "${{ secrets.RENDER_AUTH_HOOK }}"
          else
            echo "RENDER_AUTH_HOOK not set. Skipping Auth Service."
          fi

      - name: Trigger API Service Deploy
        run: |
          if [ -n "${{ secrets.RENDER_API_HOOK }}" ]; then
            echo "Deploying API Service..."
            curl -s -X POST "${{ secrets.RENDER_API_HOOK }}"
          else
            echo "RENDER_API_HOOK not set. Skipping API Service."
          fi

      - name: Trigger Chat Service Deploy
        run: |
          if [ -n "${{ secrets.RENDER_CHAT_HOOK }}" ]; then
            echo "Deploying Chat Service..."
            curl -s -X POST "${{ secrets.RENDER_CHAT_HOOK }}"
          else
            echo "RENDER_CHAT_HOOK not set. Skipping Chat Service."
          fi

      - name: Legacy Deploy Hook (Fallback)
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK }}" ] && [ -z "${{ secrets.RENDER_API_HOOK }}" ]; then
            echo "Falling back to monolithic deployment..."
            curl -s -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"
          fi

  # 5. Backup Supabase Database
  backup-database:
    name: Backup Database (Supabase)
    runs-on: ubuntu-24.04
    needs: [deploy-backend]
    continue-on-error: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Backup Supabase Database Schema
        continue-on-error: true
        timeout-minutes: 5
        run: |
          if [ -z "${{ secrets.SUPABASE_ACCESS_TOKEN }}" ] || \
             [ -z "${{ secrets.SUPABASE_PROJECT_ID }}" ] || \
             [ -z "${{ secrets.SUPABASE_DB_PASSWORD }}" ]; then
            echo "Supabase secrets missing — skipping optional database backup."
            exit 0
          fi

          echo "Linking Supabase project..."
          supabase link \
            --project-ref "${{ secrets.SUPABASE_PROJECT_ID }}" \
            --password "${{ secrets.SUPABASE_DB_PASSWORD }}" || {
            echo "⚠️  Supabase link failed (bad credentials or 504 gateway). Skipping DB backup."
            exit 0
          }

          echo "Dumping database schema (data-only)..."
          BACKUP_FILE="supabase_backup_$(date +%Y%m%d_%H%M%S).sql"
          # Use --db-url to avoid Supabase Management API 504 timeouts on free tier
          supabase db dump \
            --linked \
            --data-only \
            -f "$BACKUP_FILE" || {
            echo "⚠️  Supabase db dump returned an error (likely 504 on free-tier — transient). Backup skipped."
            exit 0
          }

          echo "✓ Backup written to $BACKUP_FILE"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Upload Database Backup Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: database-backup
          path: supabase_backup_*.sql
          retention-days: 7
