name: Keep Services Awake (Render + Supabase)

on:
  schedule:
    # Runs every 8 minutes — keeps Render awake (15-min idle spin-down)
    - cron: '*/8 * * * *'
  workflow_dispatch:

jobs:
  keep-render-awake:
    name: Ping Render Microservices
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Outpost API Primary Health
        run: |
          echo "Pinging Outpost Render backend..."
          STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" "https://outpost-app.onrender.com/api/health" --max-time 90 || echo "failed")
          echo "Outpost API responded with HTTP $STATUS"

      - name: Ping Outpost D.I.S.M.W Security Engine
        run: |
          echo "Pinging D.I.S.M.W Frontier Security Status..."
          STATUS=$(curl -s -k -o /dev/null -w "%{http_code}" "https://outpost-app.onrender.com/api/security/dismw/wall-status" --max-time 90 || echo "failed")
          echo "D.I.S.M.W responded with HTTP $STATUS"

  keep-supabase-awake:
    name: Query Supabase Real Database
    runs-on: ubuntu-24.04
    steps:
      - name: Query Supabase REST API (Live Database Read)
        run: |
          echo "Executing authenticated database query on Supabase..."
          URL="${{ secrets.SUPABASE_URL }}"
          if [ -z "$URL" ]; then
            URL="${{ secrets.VITE_SUPABASE_URL }}"
          fi
          if [ -z "$URL" ]; then
            URL="https://idivdegwxgwudgxcuaso.supabase.co"
          fi

          KEY="${{ secrets.SUPABASE_SERVICE_KEY }}"
          if [ -z "$KEY" ]; then
            KEY="${{ secrets.SUPABASE_ANON_KEY }}"
          fi
          # Note: Set SUPABASE_SERVICE_KEY in GitHub Actions Secrets
          # (Repo → Settings → Secrets and variables → Actions)

          # Querying the actual table 'messages' with LIMIT 1 forces PostgreSQL execution
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "apikey: ${KEY}" \
            -H "Authorization: Bearer ${KEY}" \
            "${URL}/rest/v1/messages?select=id&limit=1" || echo "000")

          echo "Supabase Table Query HTTP Response: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            echo "✓ Supabase PostgreSQL query executed successfully — 7-day inactivity pause prevented!"
          else
            echo "HTTP $HTTP_CODE - Fallback checking root gateway"
            curl -s -o /dev/null -w "%{http_code}" -H "apikey: ${KEY}" -H "Authorization: Bearer ${KEY}" "${URL}/rest/v1/"
          fi
