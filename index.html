<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="google-site-verification" content="sbEhpAArT4_cT7ZsDBjaNR0PMRxIFe4gqpXq7z7oi48" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#ea580c" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Outpost | Secure Community Basecamp</title>
    <meta name="description" content="Outpost is a tactical, secure, and modern communication platform designed to redefine how technical teams and gaming squads deploy basecamps and manage perimeters." />
    <meta name="keywords" content="outpost, chat, secure communication, gaming squad, basecamp, technical teams, real-time messaging" />
    <meta name="author" content="Harshit Mehta" />
    
    <!-- Open Graph / Social Media Meta Tags -->
    <meta property="og:title" content="Outpost | Secure Community Basecamp" />
    <meta property="og:description" content="A tactical, secure, and modern communication platform for technical teams and gaming squads." />
    <meta property="og:image" content="/logo.png" />
    <meta property="og:type" content="website" />
    
    <script>
      try {
        let themeId = null;
        const userStr = localStorage.getItem("outpost_user");
        if (userStr) {
          try {
            const user = JSON.parse(userStr);
            if (user && user.username) {
              themeId = localStorage.getItem("outpost-theme-id-" + user.username);
            }
          } catch(e) {}
        }
        if (!themeId) themeId = localStorage.getItem("outpost-theme-id");
        
        if (themeId) {
          const themeColors = {
            "orange-solid": { primary: "234, 88, 12", isGradient: false },
            "rose-solid": { primary: "225, 29, 72", isGradient: false },
            "slate-solid": { primary: "71, 85, 105", isGradient: false },
            "emerald-solid": { primary: "5, 150, 105", isGradient: false },
            "slate-khaki": { primary: "115, 115, 95", isGradient: true, start: "#475569", end: "#8a8a73" },
            "rose-gold": { primary: "225, 29, 72", isGradient: true, start: "#e11d48", end: "#fb923c" },
            "cyber-pulse": { primary: "234, 88, 12", isGradient: true, start: "#ea580c", end: "#701a75" },
            "deep-blue-blend": { primary: "29, 78, 216", isGradient: true, start: "#0369a1", end: "#1d4ed8" }
          };
          const root = document.documentElement;
          const theme = themeColors[themeId];
          if (theme) {
            root.style.setProperty("--brand-primary", theme.primary);
            if (theme.isGradient) {
              root.style.setProperty("--brand-gradient-start", theme.start);
              root.style.setProperty("--brand-gradient-end", theme.end);
            } else {
              root.style.setProperty("--brand-gradient-start", `rgb(${theme.primary})`);
              root.style.setProperty("--brand-gradient-end", `rgb(${theme.primary})`);
            }
          }
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"><!--ssr-outlet--></div>
    <script type="module" src="/src/entry-client.jsx"></script>
  </body>
</html>
