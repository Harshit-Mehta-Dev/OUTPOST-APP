
services:
  # The Node.js API and WebSocket Server
  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=10000
      # Provide a placeholder or map your local .env
      # - MONGODB_URI=your_mongodb_uri
      - NODE_ENV=development
    networks:
      - outpost-network

  # The Vite React SSR Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      - backend
    networks:
      - outpost-network

  # Redis for Socket.io scaling
  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - outpost-network

  # Nginx Reverse Proxy
  proxy:
    image: nginx:alpine
    ports:
      - "9080:80"
      - "9081:8081"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
      - n8n
    networks:
      - outpost-network

  # Jenkins CI/CD Server
  jenkins:
    image: jenkins/jenkins:lts
    user: root
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      - jenkins_data:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - outpost-network

  # PostgreSQL Database for n8n
  n8n-db:
    image: postgres:16-alpine
    restart: always
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n_secure_password
      - POSTGRES_DB=n8n
    volumes:
      - n8n_db_data:/var/lib/postgresql/data
    networks:
      - outpost-network

  # n8n Automation Server
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    environment:
      - DB_TYPE=postgresdb
      - DB_POSTGRESDB_HOST=n8n-db
      - DB_POSTGRESDB_PORT=5432
      - DB_POSTGRESDB_DATABASE=n8n
      - DB_POSTGRESDB_USER=n8n
      - DB_POSTGRESDB_PASSWORD=n8n_secure_password
      - N8N_ENFORCEMENT_USER_MANAGEMENT=true
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_PUSH_BACKEND=websocket
      - WEBHOOK_URL=http://localhost:9081
      - N8N_LISTEN_ADDRESS=0.0.0.0
      - N8N_HOST=localhost
      - N8N_PROXY_HOPS=1
    volumes:
      - n8n_data:/home/node/.n8n
    depends_on:
      - n8n-db
    networks:
      - outpost-network

networks:
  outpost-network:
    driver: bridge

volumes:
  jenkins_data:
  n8n_db_data:
  n8n_data:
