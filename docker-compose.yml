version: '3.8'

services:
  # The Node.js API and WebSocket Server
  backend:
    build: 
      context: ./server
      dockerfile: Dockerfile
    environment:
      - PORT=10000
      # Provide a placeholder or map your local .env
      # - MONGODB_URI=your_mongodb_uri
      - NODE_ENV=development
    networks:
      - outpost-network

  # The Vite React SSR Frontend
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    command: npm run dev:ssr
    depends_on:
      - backend
    networks:
      - outpost-network

  # Redis for Socket.io scaling
  redis:
    image: redis:alpine
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - outpost-network

  # Nginx Reverse Proxy
  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - outpost-network
networks:
  outpost-network:
    driver: bridge
